modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://aquateche.store/support"

# IGNORE_ALL_VERSION keeps vanilla / non-modded clients connectable to a Mohist server
# that runs AquaLumen UI. Such clients automatically fall back to the chest-based hub.
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://aquateche.store"
logoFile="logo.png"
authors="${mod_authors}"
displayTest="IGNORE_ALL_VERSION"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="mcef"
    mandatory=false
    versionRange="[2.1,)"
    ordering="AFTER"
    side="CLIENT"
