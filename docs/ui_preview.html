<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaTech Minecraft Forge 1.20.1 — UI Interactive Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070D18;
            --aqua-glow: #5CE1FF;
            --aqua-muted: rgba(92, 225, 255, 0.25);
            --glass-fill: rgba(16, 26, 46, 0.72);
            --glass-card: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(92, 225, 255, 0.35);
            --glass-border-hover: rgba(142, 240, 255, 0.85);
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --gold: #FFD700;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(14, 116, 144, 0.35) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(15, 23, 42, 0.9) 0%, transparent 50%);
        }

        /* Screen Switcher */
        .tab-bar {
            position: absolute;
            top: 24px;
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            padding: 6px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .tab-btn {
            padding: 10px 24px;
            border-radius: 20px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(14, 116, 144, 0.8), rgba(6, 182, 212, 0.6));
            color: #FFFFFF;
            box-shadow: 0 0 16px rgba(6, 182, 212, 0.4);
        }

        /* Ambient Particles & Blur */
        .viewport {
            position: relative;
            width: 1000px;
            height: 620px;
            background: radial-gradient(circle at center, rgba(16, 35, 60, 0.6) 0%, rgba(7, 13, 24, 0.95) 100%);
            border-radius: 16px;
            border: 1px solid rgba(92, 225, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        /* F4 Main Menu Screen */
        .menu-card {
            width: 360px;
            background: var(--glass-card);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.4s ease-out;
        }

        .menu-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .porthole {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #5CE1FF, #0F172A);
            border: 2px solid rgba(92, 225, 255, 0.6);
            box-shadow: 0 0 12px rgba(92, 225, 255, 0.4);
            margin-bottom: 4px;
        }

        .menu-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(180deg, #FFFFFF 0%, #8EF0FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(92, 225, 255, 0.3);
        }

        .menu-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Profile Strip */
        .profile-strip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 14px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0EA5E9, #0284C7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: white;
            box-shadow: 0 0 8px rgba(14, 165, 233, 0.5);
        }

        .user-name {
            font-size: 13px;
            font-weight: 600;
        }

        .balance-pill {
            background: rgba(92, 225, 255, 0.15);
            border: 1px solid rgba(92, 225, 255, 0.3);
            border-radius: 14px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 700;
            color: var(--aqua-glow);
        }

        /* Button Grid */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .menu-btn {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(92, 225, 255, 0.2);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-btn:hover {
            background: rgba(14, 116, 144, 0.35);
            border-color: var(--aqua-glow);
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(6, 182, 212, 0.25);
        }

        .btn-icon {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--aqua-glow);
            box-shadow: 0 0 6px var(--aqua-glow);
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
        }

        /* K Skill Tree View */
        .skill-screen {
            width: 100%;
            height: 100%;
            display: none;
            padding: 24px;
            grid-template-columns: 320px 1fr;
            gap: 24px;
        }

        .skill-sidebar {
            background: var(--glass-card);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .tree-map {
            position: relative;
            background: rgba(10, 18, 32, 0.7);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .node {
            position: absolute;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid var(--aqua-glow);
            box-shadow: 0 0 15px rgba(92, 225, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .node.unlocked {
            background: linear-gradient(135deg, #0EA5E9, #0284C7);
            border-color: #FFFFFF;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.7);
        }

        .node:hover {
            transform: scale(1.15);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('f4')">F4 Меню Сервера</button>
        <button class="tab-btn" onclick="switchTab('k')">K Созвездия Океана (Skills)</button>
    </div>

    <div class="viewport">
        <!-- F4 Screen -->
        <div id="f4-view" class="menu-card">
            <div class="menu-header">
                <div class="porthole"></div>
                <div class="menu-title">AQUATECH</div>
                <div class="menu-subtitle">Меню сервера · F4</div>
            </div>

            <div class="profile-strip">
                <div class="user-info">
                    <div class="avatar">A</div>
                    <div class="user-name">Player</div>
                </div>
                <div class="balance-pill">✦ 1 250</div>
            </div>

            <div class="btn-grid">
                <div class="menu-btn"><span>Киты</span><div class="btn-icon"></div></div>
                <div class="menu-btn"><span>Варпы</span><div class="btn-icon"></div></div>
                <div class="menu-btn"><span>Спавн</span><div class="btn-icon"></div></div>
                <div class="menu-btn"><span>Рынок рыбы</span><div class="btn-icon"></div></div>
                <div class="menu-btn"><span>Донат</span><div class="btn-icon"></div></div>
                <div class="menu-btn"><span>Квесты</span><div class="btn-icon"></div></div>
                <div class="menu-btn"><span>Кейсы</span><div class="btn-icon"></div></div>
                <div class="menu-btn"><span>Хранилище</span><div class="btn-icon"></div></div>
                <div class="menu-btn"><span>Лимиты</span><div class="btn-icon"></div></div>
                <div class="menu-btn"><span>Вид</span><div class="btn-icon"></div></div>
            </div>

            <div class="footer-note">клик по нику — кабинет</div>
        </div>

        <!-- K Skill Tree Screen -->
        <div id="k-view" class="skill-screen">
            <div class="skill-sidebar">
                <h3 style="font-size: 16px; color: var(--aqua-glow);">Созвездие Океана</h3>
                <p style="font-size: 12px; color: var(--text-muted);">Глубинное Дыхание</p>
                <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; font-size: 12px;">
                    Позволяет находиться под водой без расхода кислорода на +30 сек.
                </div>
                <div style="font-size: 13px; font-weight: 600; color: var(--gold);">Очки навыков: 5 ✦</div>
                <button style="background: linear-gradient(135deg, #0EA5E9, #0284C7); border: none; padding: 10px; border-radius: 8px; color: white; font-weight: 600; cursor: pointer;">Изучить (1 Очко)</button>
            </div>
            <div class="tree-map">
                <div class="node unlocked" style="top: 50%; left: 20%;">✦</div>
                <div class="node unlocked" style="top: 35%; left: 45%;">★</div>
                <div class="node" style="top: 65%; left: 45%;">★</div>
                <div class="node" style="top: 50%; left: 75%;">⚓</div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (tab === 'f4') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('f4-view').style.display = 'flex';
                document.getElementById('k-view').style.display = 'none';
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('f4-view').style.display = 'none';
                document.getElementById('k-view').style.display = 'grid';
            }
        }
    </script>
</body>
</html>
