<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HUD Игрока · AquaTech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #f1f5f9;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .player-hud-card {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 240px;
      background: rgba(8, 20, 32, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 18px;
      padding: 16px 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 24px rgba(0, 229, 255, 0.14);
      animation: hudSlide 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes hudSlide {
      from { opacity: 0; transform: translateY(-10px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .hud-player-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .hud-avatar-box {
      position: relative;
      width: 38px;
      height: 38px;
      flex-shrink: 0;
    }

    .hud-avatar {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      border: 1.5px solid #00e5ff;
      background: #020617;
      display: block;
    }

    .hud-status-dot {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 10px;
      height: 10px;
      background: #10b981;
      border-radius: 50%;
      border: 2px solid #081420;
      box-shadow: 0 0 8px #10b981;
    }

    .hud-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .hud-nick {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .hud-rank {
      font-size: 11px;
      font-weight: 700;
      color: #00e5ff;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .hud-metrics {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .metric-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(4, 12, 22, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 9px 12px;
      transition: border-color 0.2s ease;
    }

    .metric-card:hover {
      border-color: rgba(0, 229, 255, 0.3);
    }

    .metric-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: #cbd5e1;
    }

    .metric-icon-coins {
      color: #fbbf24;
      filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.5));
    }

    .metric-icon-time {
      color: #38bdf8;
      filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.5));
    }

    .metric-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <div class="player-hud-card" id="player-hud">
    <div class="hud-player-header">
      <div class="hud-avatar-box">
        <img class="hud-avatar" id="player-avatar" src="https://mc-heads.net/avatar/Renfild" alt="Avatar" />
        <div class="hud-status-dot"></div>
      </div>
      <div class="hud-info">
        <span class="hud-nick" id="hud-nick">Renfild</span>
        <span class="hud-rank" id="hud-rank">ИГРОК</span>
      </div>
    </div>

    <div class="hud-metrics">
      <div class="metric-card">
        <div class="metric-title">
          <span class="metric-icon-coins">💰</span>
          <span>Монеты</span>
        </div>
        <span class="metric-num" id="hud-coins">0</span>
      </div>

      <div class="metric-card">
        <div class="metric-title">
          <span class="metric-icon-time">⏱</span>
          <span>В игре</span>
        </div>
        <span class="metric-num" id="hud-playtime">0 ч</span>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let currentNick = urlParams.get('nick') || 'Renfild';

    function updateHud(nick) {
      if (!nick) return;
      currentNick = nick;
      document.getElementById('hud-nick').textContent = currentNick;
      document.getElementById('player-avatar').src = `https://mc-heads.net/avatar/${encodeURIComponent(currentNick)}`;

      // Fetch player data directly from database API
      fetch(`/api/profiles/${encodeURIComponent(currentNick)}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.ok && data.profile) {
            const p = data.profile;
            document.getElementById('hud-coins').textContent = Number(p.coins || 0).toLocaleString('ru-RU');
            document.getElementById('hud-playtime').textContent = p.playtime || `${p.playtime_hours || 0} ч`;
            if (p.privilege) {
              document.getElementById('hud-rank').textContent = String(p.privilege).toUpperCase();
            }
          }
        })
        .catch(() => {});
    }

    // Initial load
    updateHud(currentNick);

    // Auto-refresh every 30 seconds
    setInterval(() => updateHud(currentNick), 30000);

    // Listen for IPC messages from client mod
    window.addEventListener('message', e => {
      try {
        const msg = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
        if (msg && msg.nick) updateHud(msg.nick);
        if (msg && msg.coins !== undefined) {
          document.getElementById('hud-coins').textContent = Number(msg.coins).toLocaleString('ru-RU');
        }
        if (msg && msg.playtime !== undefined) {
          document.getElementById('hud-playtime').textContent = msg.playtime;
        }
      } catch (err) {}
    });
  </script>
</body>
</html>
