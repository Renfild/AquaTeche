<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Древо Созвездий Океана · AquaTech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent !important;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .skills-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px;
      background: rgba(8, 18, 30, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .skills-title {
      font-size: 20px;
      font-weight: 800;
      color: #00e5ff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(0, 229, 255, 0.45);
    }

    .points-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid #00e5ff;
      border-radius: 100px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 700;
      color: #00e5ff;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: rgba(0, 229, 255, 0.15);
      border-color: #00e5ff;
      color: #fff;
    }

    .btn-close {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fff;
    }

    .skills-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
    }
    .skills-viewport:active {
      cursor: grabbing;
    }

    #constellation-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .nodes-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 2400px;
      height: 2400px;
      transform-origin: 0 0;
    }

    .skill-node {
      position: absolute;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      background: #081422;
      border: 2px solid #233549;
      color: #64748b;
    }

    .skill-node:hover {
      transform: scale(1.22);
      z-index: 5;
    }

    .node-small {
      width: 36px;
      height: 36px;
      font-size: 14px;
    }

    .node-notable {
      width: 50px;
      height: 50px;
      border-width: 3px;
      font-size: 18px;
    }

    .node-keystone {
      width: 66px;
      height: 66px;
      border-width: 3.5px;
      font-size: 24px;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
    }

    .node-learned {
      border-color: #00e5ff !important;
      background: #0c2b48 !important;
      color: #fff !important;
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.55) !important;
    }

    .node-available {
      border-color: #10b981 !important;
      color: #10b981 !important;
      animation: pulseNode 2s infinite ease-in-out;
    }

    @keyframes pulseNode {
      0%, 100% { box-shadow: 0 0 6px rgba(16, 185, 129, 0.3); }
      50% { box-shadow: 0 0 18px rgba(16, 185, 129, 0.7); }
    }

    /* Tooltip */
    .skill-tooltip {
      position: absolute;
      bottom: 24px;
      left: 24px;
      width: 340px;
      background: rgba(8, 18, 30, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      pointer-events: none;
      z-index: 20;
    }

    .tooltip-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .tooltip-title {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
    }

    .tooltip-cost {
      font-size: 12px;
      font-weight: 700;
      color: #00e5ff;
      background: rgba(0, 229, 255, 0.12);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .tooltip-desc {
      font-size: 13px;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 10px;
    }

    .tooltip-status {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>

    let learned = new Set(["origin"]);
    let availablePoints = 0;

    const viewport = document.getElementById("viewport");
    const container = document.getElementById("nodes-box");
    const canvas = document.getElementById("constellation-canvas");
    const ctx = canvas.getContext("2d");

    let panX = 0, panY = 0;
    let isDragging = false;
    let startX, startY;

    const urlParams = new URLSearchParams(window.location.search);
    const nick = urlParams.get('nick') || 'Renfild';

    fetch(`/api/profiles/${encodeURIComponent(nick)}`)
      .then(res => res.json())
      .then(data => {
        if (data && data.ok && data.profile) {
          const p = data.profile;
          if (p.skill_points !== undefined) {
            availablePoints = Number(p.skill_points || 0);
          }
          if (Array.isArray(p.learned_skills)) {
            p.learned_skills.forEach(s => learned.add(s));
          }
          document.getElementById('points-val').textContent = availablePoints;
          renderNodes();
          drawLines();
        }
      })
      .catch(() => {});

    function resizeCanvas() {
      canvas.width = viewport.clientWidth;
      canvas.height = viewport.clientHeight;
      drawLines();
    }
    window.addEventListener("resize", resizeCanvas);

    function initViewport() {
      panX = viewport.clientWidth / 2 - 1200;
      panY = viewport.clientHeight / 2 - 1200;
      updateTransform();
    }

    function updateTransform() {
      container.style.transform = `translate(${panX}px, ${panY}px)`;
      drawLines();
    }

    function drawLines() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      SKILLS.forEach(node => {
        if (!node.prereq) return;
        const parent = SKILLS.find(s => s.id === node.prereq);
        if (!parent) return;

        const x1 = parent.x + panX;
        const y1 = parent.y + panY;
        const x2 = node.x + panX;
        const y2 = node.y + panY;

        const isUnlocked = learned.has(node.id) && learned.has(parent.id);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = isUnlocked ? 3 : 1.5;
        ctx.strokeStyle = isUnlocked ? "#00e5ff" : "rgba(35, 53, 73, 0.6)";
        if (isUnlocked) {
          ctx.shadowColor = "#00e5ff";
          ctx.shadowBlur = 8;
        } else {
          ctx.shadowBlur = 0;
        }
        ctx.stroke();
      });
    }

    function renderNodes() {
      container.innerHTML = "";
      document.getElementById("points-val").textContent = availablePoints;
      SKILLS.forEach(skill => {
        const el = document.createElement("div");
        el.className = `skill-node node-${skill.type}`;
        el.style.left = `${skill.x - (skill.type === 'keystone' ? 33 : skill.type === 'notable' ? 25 : 18)}px`;
        el.style.top = `${skill.y - (skill.type === 'keystone' ? 33 : skill.type === 'notable' ? 25 : 18)}px`;
        el.innerHTML = `<span>${skill.icon}</span>`;

        const isLearned = learned.has(skill.id);
        const canLearn = !isLearned && (!skill.prereq || learned.has(skill.prereq)) && availablePoints >= skill.cost;

        if (isLearned) el.classList.add("node-learned");
        else if (canLearn) el.classList.add("node-available");

        el.addEventListener("mouseenter", () => showTooltip(skill, isLearned, canLearn));
        el.addEventListener("mouseleave", hideTooltip);
        el.addEventListener("click", () => handleNodeClick(skill));

        container.appendChild(el);
      });
    }

    const tooltip = document.getElementById("tooltip");
    function showTooltip(skill, isLearned, canLearn) {
      document.getElementById("tt-title").textContent = skill.title;
      document.getElementById("tt-cost").textContent = `${skill.cost} ${skill.cost === 1 ? 'Очко' : 'Очка'}`;
      document.getElementById("tt-desc").textContent = skill.desc;
      const statusEl = document.getElementById("tt-status");
      if (isLearned) {
        statusEl.textContent = "ИЗУЧЕНО";
        statusEl.style.color = "#00e5ff";
      } else if (canLearn) {
        statusEl.textContent = "ДОСТУПНО ДЛЯ ИЗУЧЕНИЯ (Клик)";
        statusEl.style.color = "#10b981";
      } else {
        statusEl.textContent = "ТРЕБУЕТСЯ ПРЕДЫДУЩИЙ НАВЫК";
        statusEl.style.color = "#ef4444";
      }
      tooltip.style.opacity = "1";
    }

    function handleNodeClick(skill) {
      if (learned.has(skill.id)) return;
      if (skill.prereq && !learned.has(skill.prereq)) return;
      if (availablePoints < skill.cost) return;

      availablePoints -= skill.cost;
      learned.add(skill.id);
      renderNodes();
      drawLines();

      ipcSend({ action: "LEARN_SKILL", skillId: skill.id });
    }

    function resetSkills() {
      learned = new Set(["origin"]);
      availablePoints = 0;
      renderNodes();
      drawLines();
      ipcSend({ action: "RESET_SKILLS" });
    }

    function resetView() {
      initViewport();
    }

    function ipcSend(payload) {
      if (window.AquaTechBridge && typeof window.AquaTechBridge.send === 'function') {
        window.AquaTechBridge.send(JSON.stringify(payload));
      } else {
        location.hash = 'aqipc=' + encodeURIComponent(JSON.stringify(payload));
      }
    }

    // Drag / Pan logic
    viewport.addEventListener("mousedown", e => {
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener("mousemove", e => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });

    window.addEventListener("keydown", e => {
      if (e.key === "Escape") ipcSend({ action: "CLOSE_GUI" });
    });

    initViewport();
    resizeCanvas();
    renderNodes();
  </script>
</body>
</html>
