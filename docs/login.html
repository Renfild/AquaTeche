<body data-page="login">
  <a class="skip-link" href="#main">К содержимому</a>
  <div id="site-header"></div>
  <main id="main">
  
  <section class="page-hero">
    <div class="container auth-shell">
      <div class="eyebrow" data-site="login_eyebrow">Аккаунт</div>
      <h1 data-site="login_title">Вход</h1>
      <p data-site="login_lead">Ник Minecraft: латиница, цифры, _.</p>
      <form class="card form" id="login-form" style="margin-top:1.25rem">
        <div class="field">
          <label for="login-nick">Ник</label>
          <input id="login-nick" name="nick" maxlength="16" placeholder="Steve" required pattern="[A-Za-z0-9_]{3,16}" autocomplete="username" autocapitalize="off" spellcheck="false" />
        </div>
        <div class="field">
          <label for="login-password">Пароль</label>
          <input id="login-password" name="password" type="password" placeholder="••••" required autocomplete="current-password" />
        </div>
        <p class="field-error" data-auth-error role="alert" aria-live="polite"></p>
        <button class="btn btn-primary" type="submit">Войти</button>
        <a class="btn btn-ghost" href="register.html">Нет аккаунта? Регистрация</a>
      </form>
    </div>
  </section>

  </main>
  <div id="site-footer"></div>
  <script src="assets/js/site.js?v=20260826s"></script>
</body>
