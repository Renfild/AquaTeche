  function bindViewActions() {
    document.querySelectorAll(".buy").forEach(b => b.onclick = () => confirmAction("Покупка", `Купить В«${b.dataset.title}В»?`, "store.buy", b.dataset.id));
    document.querySelectorAll(".rank-more").forEach(b => b.onclick = () => {
      const offer = (state.payload.snapshot.store || []).find(x => x.id === b.dataset.id);
      if (offer && !offer.owned) openRankModal(offer);
    });
    document.querySelectorAll(".event-claim").forEach(b => b.onclick = () => action("events.claim", b.dataset.idx));
    document.querySelectorAll(".event-reroll").forEach(b => b.onclick = () => confirmAction("Сменить контракт", "Списать " + coins(100) + "?", "events.reroll", b.dataset.idx));
    
    document.querySelectorAll(".preview-case").forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      const def = (state.payload.snapshot.cases || []).find(c => c.id === b.dataset.id);
      if (def) CasePreview.open(def);
    });
    
    document.querySelectorAll(".card.case").forEach(card => card.onclick = () => {
      const cid = card.dataset.preview;
      const def = (state.payload.snapshot.cases || []).find(c => c.id === cid);
      if (def) CasePreview.open(def);
    });

    document.querySelectorAll(".open-case").forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      const def = (state.payload.snapshot.cases || []).find(c => c.id === b.dataset.id);
      if (!def || !caseBudget(def).can(1)) return;
      CaseSpin.open(def);
      action("case.open", def.id);
    });

    document.querySelectorAll(".claim-pass").forEach(b => b.onclick = () => {
      const lvl = Number(b.dataset.level);
      if (!state.payload.snapshot.season.claimedTiers) state.payload.snapshot.season.claimedTiers = [];
      if (!state.payload.snapshot.season.claimedTiers.map(Number).includes(lvl)) {
        state.payload.snapshot.season.claimedTiers.push(lvl);
      }
      if (state.payload.snapshot.season.claimable > 0) {
        state.payload.snapshot.season.claimable--;
      }
      const card = b.closest(".pass-card") || b.closest(".reward");
      if (card) {
        card.classList.remove("is-claimable");
        card.classList.remove("claimable");
        card.classList.add("is-claimed");
      }
      b.outerHTML = `<div class="pass-status-badge claimed"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m4 12 5 5L20 6"/></svg> Забрано</div>`;
      renderNav();
      action("pass.claim", String(lvl));
      toast("Награда уровня " + lvl + " получена!");
      setTimeout(() => action("hub.refresh"), 400);
    });

    document.querySelectorAll(".claim-kit").forEach(b => {
      if (b.disabled) return;
      b.onclick = () => {
        action("hub.kit", b.dataset.kit);
        toast("Набор запроС€ен!");
        setTimeout(() => action("hub.refresh"), 500);
      };
    });

    // Магазин: поиск по названию (категории убраны по просьбе владельца)
    const shopSearch = document.getElementById("shopSearch");
    const applyShopFilter = () => {
      const grid = document.getElementById("shopGrid");
      if (!grid) return;
      const q = (shopSearch ? shopSearch.value : "").trim().toLowerCase();
      grid.querySelectorAll("[data-shop-name]").forEach(card => {
        card.style.display = !q || (card.dataset.shopName || "").includes(q) ? "" : "none";
      });
    };
    if (shopSearch) shopSearch.oninput = applyShopFilter;

    document.querySelectorAll(".tp-warp").forEach(b => b.onclick = () => {
      action("hub.warp", b.dataset.warp);
      toast("Телепортация...");
      setTimeout(() => send({ type: "action", action: "hub.close" }), 300);
    });

    document.querySelectorAll(".atlas-pill").forEach(p => p.onclick = () => {
      document.querySelectorAll(".atlas-pill").forEach(x => x.classList.toggle("active", x === p));
      const f = p.dataset.filter;
      document.querySelectorAll("#atlasGrid [data-found]").forEach(card => {
        const found = card.dataset.found === "1";
        card.style.display = (f === "all" || (f === "found" && found) || (f === "missing" && !found)) ? "" : "none";
      });
    });

    document.querySelectorAll(".sell-all-fish").forEach(b => b.onclick = () => {
      action("fish.sell_all");
      toast("Продажа рыбы...");
      setTimeout(() => action("hub.refresh"), 400);
    });

    document.querySelectorAll(".sell-single-fish").forEach(b => b.onclick = () => {
      action("fish.sell", b.dataset.fish);
      toast("Продажа рыбы...");
      setTimeout(() => action("hub.refresh"), 400);
    });

    document.querySelectorAll(".buy-auction").forEach(b => b.onclick = () => {
      toast("Покупка лота...");
      action("auction.buy", String(b.dataset.id));
      setTimeout(() => action("hub.refresh"), 500);
    });

    document.querySelectorAll(".cancel-auction").forEach(b => b.onclick = () => {
      toast("Снятие лота...");
      action("auction.cancel", String(b.dataset.id));
      setTimeout(() => action("hub.refresh"), 500);
    });

    /* Auction Search, Filters & Quick Sell Command Helper */
    const searchInput = $("auctionSearchInput");
    const clearBtn = $("auctionSearchClear");
    const filterPills = document.querySelectorAll(".auction-pill");
    let activeFilter = "all";

    function filterLots() {
      const q = (searchInput ? searchInput.value : "").trim().toLowerCase();
      if (clearBtn) clearBtn.style.display = q ? "grid" : "none";
      const cards = document.querySelectorAll("#auctionCardGrid .lot-card");
      let visibleCount = 0;
      cards.forEach(card => {
        const matchesQuery = !q || (card.dataset.name || "").includes(q);
        const isSelf = card.dataset.self === "1";
        const matchesFilter = activeFilter === "all" || (activeFilter === "self" && isSelf);
        if (matchesQuery && matchesFilter) {
          card.style.display = "";
          visibleCount++;
        } else {
          card.style.display = "none";
        }
      });
      const emptyEl = $("auctionEmpty");
      if (emptyEl) {
        emptyEl.style.display = visibleCount === 0 ? "block" : "none";
      }
    }

    if (searchInput) {
      searchInput.oninput = filterLots;
    }
    if (clearBtn) {
      clearBtn.onclick = () => {
        searchInput.value = "";
        filterLots();
        searchInput.focus();
      };
    }
    filterPills.forEach(pill => {
      pill.onclick = () => {
        filterPills.forEach(p => p.classList.remove("active"));
        pill.classList.add("active");
        activeFilter = pill.dataset.filter || "all";
        filterLots();
      };
    });

    const handleCopyCmd = () => {
      const cmd = "/ah sell ";
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(cmd).catch(() => {});
      }
      toast("Команда скопирована: /ah sell <цена>");
    };
    const copyBtn = $("copySellCmdBtn");
    if (copyBtn) copyBtn.onclick = handleCopyCmd;
    const copyEmptyBtn = $("copySellCmdEmpty");
    if (copyEmptyBtn) copyEmptyBtn.onclick = handleCopyCmd;

    document.querySelectorAll(".swatch").forEach(b => b.onclick = () => {
      send({ type: "settings", theme: b.dataset.theme });
      state.payload.appearance.theme = b.dataset.theme;
      applyAppearance();
      renderView(false, true);
    });

    const toggle = $("motionToggle");
    if (toggle) toggle.onclick = () => {
      const enabled = !state.payload.appearance.animations;
      send({ type: "settings", animations: enabled });
      state.payload.appearance.animations = enabled;
      applyAppearance();
      renderView(false, true);
    };
  }

  function renderView(animate, preserveScroll = true) {
    const s = state.payload.snapshot;
    const views = {
      profile: profileView,  cases: casesView,
      pass: passView, fishing: fishingView, atlas: fishAtlasView, events: eventsView, auction: auctionView, kits: kitsView,
      privileges: (s) => storeView(s, true), store: (s) => storeView(s, false),
      warps: warpsView, tops: topsView, settings: settingsView
    };
    const currentView = $("content")?.querySelector(".view");
    const savedScroll = (preserveScroll && currentView) ? currentView.scrollTop : 0;

    $("content").innerHTML = (views[state.tab] || profileView)(s);
    
    const newView = $("content")?.querySelector(".view");
    if (newView && savedScroll > 0) {
      newView.scrollTop = savedScroll;
    }
    if (animate) $("content").firstElementChild?.classList.add("view-enter");
    bindViewActions();
  }

  function renderNav() {
    const tabs = state.payload.enabledTabs || [];
    $("nav").innerHTML = tabs.map(k => {
      const meta = tabMeta[k] || [k, '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>'];
      const active = state.tab === k ? "active" : "";
      let b = "";
      if (k === "pass" && state.payload.snapshot.season.claimable > 0) {
        b = `<span class="badge">${state.payload.snapshot.season.claimable}</span>`;
      }
      return `<button class="nav-button ${active}" data-tab="${k}">${meta[1]}<span class="nav-label">${meta[0]}</span>${b}</button>`;
    }).join("");

    document.querySelectorAll(".nav-button").forEach(b => {
      b.onclick = () => {
        if (state.tab === b.dataset.tab) return;
        state.tab = b.dataset.tab;
        renderNav();
        renderView(true, false);
      };
    });
  }

  function applyAppearance() {
    const a = state.payload.appearance || {};
    const spr = (state.payload.snapshot || {}).profile;
    const prank = spr && spr.rankColor ? "#" + ((spr.rankColor & 0xffffff).toString(16).padStart(6, "0")) : "";
    document.documentElement.style.setProperty("--prank", prank);
    document.documentElement.style.setProperty("--prank-soft", prank ? prank + "30" : "");
    const root = document.documentElement;
    root.classList.toggle("reduce-motion", a.animations === false);
    if (a.theme === "violet_lumen") {
      root.style.setProperty("--accent", "#b072ff");
      root.style.setProperty("--accent2", "#ff6bc1");
    } else if (a.theme === "midnight_rose") {
      root.style.setProperty("--accent", "#ff7a9c");
      root.style.setProperty("--accent2", "#ffb27a");
    } else {
      root.style.setProperty("--accent", "#2fe0c0");
      root.style.setProperty("--accent2", "#3b9dff");
    }
  }

  let lastSnapshotJson = "";
  function applyPayload(payload) {
    if (!payload) return;
    state.payload = payload;
    const s = payload.snapshot || {};

    if ($("online")) $("online").textContent = `${(s.server && s.server.online) || 0}/${(s.server && s.server.slots) || 100}`;
    if ($("tps")) $("tps").textContent = `${((s.server && s.server.tps) || 20).toFixed(1)} TPS`;
    if ($("coins")) $("coins").textContent = num(s.wallet ? s.wallet.coins : 0);
    if ($("gems")) $("gems").textContent = num(s.wallet ? s.wallet.gems : 0);
    if ($("build")) $("build").textContent = (s.server && s.server.build) || "AquaLumen UI";
    if ($("openKey")) $("openKey").textContent = payload.openKey || "F4";

    applyAppearance();
    
    function getTabDataKey(tab) {
      if (!s) return "";
      switch (tab) {
        case "auction": return JSON.stringify(s.market || []);
        case "pass": return JSON.stringify([s.season, s.wallet ? s.wallet.coins : 0]);
        case "profile": return JSON.stringify([s.player, s.wallet]);
        case "store": return JSON.stringify([s.store, s.wallet]);
        case "privileges": return JSON.stringify([s.store, s.wallet]);
        case "fishing": return JSON.stringify([s.fishing, s.wallet]);
        case "atlas": return JSON.stringify([s.atlas, s.atlasSummary]);
        case "cases": return JSON.stringify([s.cases, s.wallet]);
        case "tops": return JSON.stringify(s.top || []);
        case "events": return JSON.stringify(s.events || []);
        case "kits": return JSON.stringify(s.kits || []);
        case "warps": return JSON.stringify(s.warps || []);
        case "settings": return "static";
        default: return "";
      }
    }

    if (!window._lastTabData) window._lastTabData = {};
    if (!window._lastNavKey) window._lastNavKey = "";

    const currentNavKey = `${s.player ? s.player.rank : ''}|${s.wallet ? s.wallet.coins : 0}|${s.wallet ? s.wallet.gems : 0}|${s.season ? s.season.claimable : 0}`;
    if (currentNavKey !== window._lastNavKey) {
      window._lastNavKey = currentNavKey;
      renderNav();
    }

    const currentTabKey = getTabDataKey(state.tab);
    if (currentTabKey !== window._lastTabData[state.tab]) {
      window._lastTabData[state.tab] = currentTabKey;
      
      let savedSearch = "";
      let savedFilter = "all";
      let searchHadFocus = false;
      let selStart = 0;
      let selEnd = 0;

      if (state.tab === "auction") {
        const inp = $("auctionSearchInput");
        if (inp) {
          savedSearch = inp.value;
          searchHadFocus = (document.activeElement === inp);
          selStart = inp.selectionStart;
          selEnd = inp.selectionEnd;
        }
        const activePill = document.querySelector(".auction-pill.active");
        if (activePill && activePill.dataset.filter) {
          savedFilter = activePill.dataset.filter;
        }
      }

      renderView(false, true);

      if (state.tab === "auction") {
        const inp = $("auctionSearchInput");
        if (inp && savedSearch) {
          inp.value = savedSearch;
          if (searchHadFocus) {
            inp.focus();
            try { inp.setSelectionRange(selStart, selEnd); } catch (e) {}
          }
        }
        if (savedFilter && savedFilter !== "all") {
          document.querySelectorAll(".auction-pill").forEach(p => {
            p.classList.toggle("active", p.dataset.filter === savedFilter);
          });
        }
        if (savedSearch || (savedFilter && savedFilter !== "all")) {
          const clearBtn = $("auctionSearchClear");
          if (clearBtn) clearBtn.style.display = savedSearch ? "grid" : "none";
          const q = savedSearch.toLowerCase();
          const cards = document.querySelectorAll("#auctionCardGrid .lot-card");
          cards.forEach(card => {
            const matchesQuery = !q || (card.dataset.name || "").includes(q);
            const isSelf = card.dataset.self === "1";
            const matchesFilter = savedFilter === "all" || (savedFilter === "self" && isSelf);
            card.style.display = (matchesQuery && matchesFilter) ? "" : "none";
          });
        }
      }
    }

    if (s.caseResult) {
      const res = s.caseResult;
      delete s.caseResult;
      if (payload.snapshot) delete payload.snapshot.caseResult;
      CaseSpin.deliver(res);
    }
  }

  $("refresh").onclick = () => { action("hub.refresh"); toast("ОбновлениевЂ¦"); };
  $("close").onclick = () => send({ type: "action", action: "hub.close" });

  $("rankModalClose").onclick = closeRankModal;
  $("rankModalCancel").onclick = closeRankModal;
  $("rankModalBuy").onclick = () => {
    if (!rankModalOffer) return;
    const id = rankModalOffer.id, title = rankModalOffer.title;
    closeRankModal();
    action("store.buy", id);
    toast(`Покупка В«${title}В»вЂ¦`);
  };

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if ($("casePreviewLayer").classList.contains("open")) {
        CasePreview.close();
        return;
      }
      if ($("caseLayer").classList.contains("open")) {
        CaseSpin.close();
        return;
      }
      if ($("rankModalLayer").classList.contains("open")) {
        closeRankModal();
        return;
      }
      if ($("modalLayer").classList.contains("open")) {
        $("modalLayer").classList.remove("open");
        send({ type: "modal", open: false });
        return;
      }
      send({ type: "action", action: "hub.close" });
    }
  });

  window.AquaLumen = {
    // Закрывает верхний открытый слой (его вызывает мод по Esc). true = что-то закрыли.
    escapeLayer() {
      if ($("casePreviewLayer") && $("casePreviewLayer").classList.contains("open")) {
        CasePreview.close();
        return true;
      }
      if ($("caseLayer") && $("caseLayer").classList.contains("open")) {
        CaseSpin.close();
        return true;
      }
      if ($("rankModalLayer") && $("rankModalLayer").classList.contains("open")) {
        closeRankModal();
        return true;
      }
      if ($("modalLayer") && $("modalLayer").classList.contains("open")) {
        $("modalLayer").classList.remove("open");
        send({ type: "modal", open: false });
        return true;
      }
      return false;
    },
    applySnapshot(snapshot) {
      applyPayload(snapshot);
    },
    update(jsonOrObj) {
      try {
        const payload = typeof jsonOrObj === "string" ? JSON.parse(jsonOrObj) : jsonOrObj;
        applyPayload(payload);
      } catch (e) {}
    },
    deliverCase(result) {
      CaseSpin.deliver(result);
    },
    closeModal() {
      if ($("casePreviewLayer") && $("casePreviewLayer").classList.contains("open")) {
        CasePreview.close();
        return;
      }
      if ($("caseLayer") && $("caseLayer").classList.contains("open")) {
        CaseSpin.close();
        return;
      }
      if ($("rankModalLayer") && $("rankModalLayer").classList.contains("open")) {
        closeRankModal();
        return;
      }
      if ($("modalLayer") && $("modalLayer").classList.contains("open")) {
        $("modalLayer").classList.remove("open");
        send({ type: "modal", open: false });
      }
    }
  };
  window.AquaLumenUI = window.AquaLumen;

  if (window.AquaLumenBridge) {
    window.AquaLumenBridge.send({ type: "ready" });
  }
})();
} catch (pageError) {
  var hubErrorBox = document.getElementById("content");
  if (hubErrorBox) {
    hubErrorBox.innerHTML = '<div class="empty">РћС€ибка интерфейса: ' +
      String(pageError && pageError.message ? pageError.message : pageError) + '</div>';
  }
  if (window.console && console.error) console.error("[AquaLumen] hub page error:", pageError);
}
</script>
</body>
</html>
