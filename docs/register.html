<body data-page="register">
  <a class="skip-link" href="#main">К содержимому</a>
  <div id="site-header"></div>
  <main id="main">
  
  <section class="page-hero">
    <div class="container auth-shell">
      <div class="eyebrow" data-site="register_eyebrow">Аккаунт</div>
      <h1 data-site="register_title">Регистрация</h1>
      <p data-site="register_lead">Ник 3–16 символов (A–Z, 0–9, _). Пароль от 8. Если уже заходил на сервер — тот же ник, задай пароль здесь.</p>
      <form class="card form" id="register-form" style="margin-top:1.25rem">
        <div class="field">
          <label for="register-nick">Ник</label>
          <input id="register-nick" name="nick" maxlength="16" placeholder="Steve" required pattern="[A-Za-z0-9_]{3,16}" autocomplete="username" autocapitalize="off" spellcheck="false" />
        </div>
        <div class="field">
          <label for="register-password">Пароль</label>
          <input id="register-password" name="password" type="password" placeholder="минимум 8 символов" required minlength="8" autocomplete="new-password" />
        </div>
        <p class="field-error" data-auth-error role="alert" aria-live="polite"></p>
        <button class="btn btn-primary" type="submit">Создать аккаунт</button>
        <a class="btn btn-ghost" href="login.html">Уже есть аккаунт? Войти</a>
      </form>
    </div>
  </section>

  </main>
  <div id="site-footer"></div>
  <script src="assets/js/site.js?v=20260827a"></script>
</body>
