# Workers Builds / wrangler deploy (reachable *.workers.dev when pages.dev is blocked)
# CI: .github/workflows/deploy-worker.yml (needs CLOUDFLARE_API_TOKEN secret)
# Local: python tools/deploy_to_cloudflare.py worker
name = "aquatech"
main = "worker/index.js"
compatibility_date = "2026-08-08"
account_id = "b855fc404ea390174024f1d249cb1964"
workers_dev = true

[[routes]]
pattern = "aquateche.store"
custom_domain = true

[[routes]]
pattern = "www.aquateche.store"
custom_domain = true

[assets]
directory = "./docs"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[vars]
PROJECT_NAME = "AquaTech"
MINECRAFT_VERSION = "1.20.1"
FORGE_VERSION = "47.4.0"
SERVER_ADDRESS = "g-pl-3.apexnodes.xyz:21561"
PURCHASES_ENABLED = "false"
SITE_CANONICAL = "https://aquateche.store"
ADMIN_NICKS = "Renfild"

[[d1_databases]]
binding = "DB"
database_name = "aquatech"
database_id = "15b52652-9374-4b2a-9fa9-cf0c5e7e8352"
