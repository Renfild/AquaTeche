# Workers Builds / wrangler deploy (reachable *.workers.dev when pages.dev is blocked)
# Dashboard deploy: npx wrangler deploy -c wrangler.worker.toml
name = "aquatech"
main = "worker/index.js"
compatibility_date = "2026-08-08"
workers_dev = true

[assets]
directory = "./docs"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[vars]
PROJECT_NAME = "AquaTech"
MINECRAFT_VERSION = "1.20.1"
FORGE_VERSION = "47.4.0"
SERVER_ADDRESS = "katherine-hydro.tun.ply.gg:31279"
PURCHASES_ENABLED = "false"
SITE_CANONICAL = "https://aquatech.santcrail.workers.dev"
ADMIN_NICKS = "Renfild"

[[d1_databases]]
binding = "DB"
database_name = "aquatech"
database_id = "15b52652-9374-4b2a-9fa9-cf0c5e7e8352"
