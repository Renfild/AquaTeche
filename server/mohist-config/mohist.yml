# This is the main configuration file for Mohist.
# As you can see, there's tons to configure. Some options may impact gameplay, so use
# with caution, and make sure you know what each option does before configuring.
# For a reference for any variable inside this file, check out the Mohist wiki at
# https://wiki.mohistmc.com/
#
# If you need help with the configuration or have any questions related to Spigot,
# join us at the Discord or drop by our forums and leave a post.
#
# Discord: https://discord.gg/mohistmc
# Forums: https://mohistmc.com/
# Forums (CN): https://mohistmc.cn/

anvilfix:
  maximumrepaircost: 40
  enchantment_fix: false
  max_enchantment_level: 32767
player_modlist_blacklist:
  enable: false
  list: []
server_modlist_whitelist:
  enable: false
  list: '[kuma_api, geckolib, sophisticatedstorage, jei, naturalist, obscure_api,
    sophisticatedcore, waystones, fragmentum, placebo, modernfix, citadel, alexsmobs,
    artifacts, lightmanscurrency, sophisticatedbackpacks, midnightlib, apotheosis,
    guideme, railways, balm, blueprint, cloth_config, forge, embeddium, rubidium,
    minecraft, upgrade_aquatic, cofh_core, thermal, farmersdelight, alexscaves, thermal_innovation,
    mousetweaks, jade, ae2, fishofthieves, kotlinforforge, curios, mekanism, mekanismgenerators,
    flywheel, ponder, create, reliquary, attributeslib, thermal_foundation, thermal_expansion,
    oceansdelight, architectury, appleskin, ferritecore, yet_another_config_lib_v3,
    aquaculture, valkyrienskies, vs_eureka, crabbersdelight, expandability, aquamirae]'
max-bees-in-hive: 3
enchantment-table-book-animation-tick: false
networkmanager:
  debug: false
  intercept: []
threadpriority:
  server_thread: 8
entity:
  clear:
    enable: false
    time: 1800
    countdown:
      msg: '[Server] §cItems will be cleared after %seconds% seconds！'
    item:
      enable: false
      whitelist: []
      msg: '[Server] Cleaned up %size% drop item'
    monster:
      enable: false
      whitelist: []
      msg: '[Server] Cleaned up %size% monster'
ban:
  item:
    enable: false
    list: []
  entity:
    enable: false
    list: []
  enchantment:
    enable: false
    list: []
motd:
  enable: false
  firstline: <RAINBOW1>A Minecraft Server</RAINBOW>
  secondline: ''
settings:
  messages:
    ping-command-output: §2%s's ping is %sms
events:
  fire_tick: false
  explosion: false
forge:
  bukkitpermissionshandler: true
worldmanage: false
velocity:
  enabled: false
  onlineMode: false
  secret: ''
recipe:
  warn: false
tpa:
  enable: false
  permissions: true
back:
  enable: false
  permissions: true
permissions:
  debug:
    console: false
    player: false
world:
  async_save: false
message:
  require_forge: This server has mods that require Forge to be installed on the client.
    Contact your server admin for more details.
server_mod_name: mohist
deepseek:
  enable: false
  apikey: mohist
  model: deepseek-chat
  system: 你的名字叫小小墨，年龄18岁，是个可爱的女孩子!
  command: ai
  chatfromat: <小小墨> %s
mohist:
  show_logo: true
  check_update: true
  watchdog_spigot: true
  watchdog_mohist: false
  lang: ru_RU
  libraries:
    check: true
  installation-finished: false
config-version: 1
keepinventory:
  global:
    enable: false
    inventory: true
    exp: true
  permission:
    inventory: mohist.keepinventory.inventory
    exp: mohist.keepinventory.exp
  world:
    inventory: false
    exp: false
