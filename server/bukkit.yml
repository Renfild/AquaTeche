settings:
  allow-end: true
  warn-on-overload: false
  permissions-file: permissions.yml
  update-folder: update
  plugin-profiling: false
  connection-throttle: 4000
  query-plugins: true
  deprecated-verbose: default
  shutdown-message: Server closed
  minimum-api: none
  use-map-color-cache: true
spawn-limits:
  monsters: 28
  animals: 8
  water-animals: 15
  water-ambient: 20
  water-underground-creature: 8
  ambient: 5
chunk-gc:
  period-in-ticks: 400
ticks-per:
  animal-spawns: 600
  monster-spawns: 10
  water-spawns: 10
  water-ambient-spawns: 15
  water-underground-creature-spawns: 20
  ambient-spawns: 40
  autosave: 6000
aliases: now-in-commands.yml
